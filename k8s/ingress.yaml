apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tzuratlink
  namespace: tzuratlink
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tzuratlink.org
        - www.tzuratlink.org
        - tzuratlink.online
        - www.tzuratlink.online
      secretName: tzuratlink-tls
  rules:
    - host: tzuratlink.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
    - host: www.tzuratlink.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
    - host: tzuratlink.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
    - host: www.tzuratlink.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
